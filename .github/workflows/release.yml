name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      - name: Build universal app
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          scripts/build-app.sh

      - name: Smoke test
        run: |
          build/markdownToPdf.app/Contents/MacOS/markdownToPdf --convert Examples/sample.md "$RUNNER_TEMP/sample.pdf"
          test -s "$RUNNER_TEMP/sample.pdf"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: markdownToPdf
          path: dist/*

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "markdownToPdf ${GITHUB_REF_NAME}" \
            --generate-notes
